<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Short Drama</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

/* ================= HEADER ================= */

header{
  height:65px;
  background:#181818;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #292929;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
  min-width:max-content;
}

.logo-img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  display:none;
}

.logo-text{
  font-size:22px;
  font-weight:bold;
  color:#ff3030;
}

.search{
  flex:1;
  max-width:650px;
  padding:11px 18px;
  border-radius:25px;
  border:1px solid #444;
  background:#242424;
  color:#fff;
  outline:none;
}

.admin-btn{
  background:#292929;
  color:#fff;
  border:0;
  padding:10px 17px;
  border-radius:22px;
  cursor:pointer;
}

.admin-btn:hover{
  background:#3b3b3b;
}

/* ================= NAV ================= */

nav{
  display:flex;
  gap:9px;
  padding:11px 16px;
  background:#151515;
  border-bottom:1px solid #292929;
  overflow-x:auto;
}

.nav-btn{
  background:#292929;
  color:#fff;
  border:0;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.nav-btn:hover{
  background:#3b3b3b;
}

/* ================= MAIN ================= */

.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.hero{
  padding:35px 25px;
  border-radius:17px;
  background:linear-gradient(135deg,#292929,#151515);
  margin-bottom:28px;
}

.hero h1{
  margin:0 0 10px;
  font-size:35px;
}

.hero p{
  color:#bbb;
}

.muted{
  color:#999;
  font-size:13px;
}

/* ================= VIDEO GRID ================= */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:#181818;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  background:#222;
}

.thumbnail{
  height:155px;
  background:linear-gradient(135deg,#292929,#171717);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.thumbnail-image{
  width:100%;
  height:100%;
  object-fit:cover;
}

.play{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#ff3030;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  position:absolute;
  box-shadow:0 3px 15px #000;
}

.info{
  padding:14px;
}

.info h3{
  margin:0 0 8px;
  font-size:17px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#999;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.91);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.hidden{
  display:none !important;
}

.box{
  width:100%;
  max-width:900px;
  max-height:94vh;
  overflow:auto;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:16px;
  padding:21px;
}

.box input,
.box select,
.box textarea{
  width:100%;
  padding:13px;
  margin:7px 0;
  background:#101010;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
  outline:none;
}

.box textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  padding:11px 17px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.red{
  background:#ff3030;
  color:#fff;
}

.green{
  background:#16803c;
  color:#fff;
}

.gray{
  background:#444;
  color:#fff;
}

.danger{
  background:#c62828;
  color:#fff;
}

.blue{
  background:#1769aa;
  color:#fff;
}

.row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:8px;
}

hr{
  border:0;
  border-top:1px solid #333;
  margin:23px 0;
}

/* ================= VIDEO PLAYER ================= */

.video-player{
  width:100%;
  height:min(70vh,520px);
  background:#000;
  display:block;
  border:0;
}

.video-thumb-preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:9px;
  margin-top:8px;
}

/* ================= DASHBOARD ================= */

.dashboard-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(170px,1fr));
  gap:12px;
  margin:15px 0;
}

.stat-card{
  background:#292929;
  border-radius:12px;
  padding:18px;
  text-align:center;
  border:1px solid #3a3a3a;
}

.stat-icon{
  font-size:30px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

.stat-title{
  color:#aaa;
  margin-top:5px;
  font-size:13px;
}

.video-stat{
  background:#242424;
  border-radius:9px;
  padding:13px;
  margin:8px 0;
}

.video-stat-title{
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  background:#333;
  border-radius:12px;
  font-size:11px;
  color:#ccc;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  header{
    height:60px;
    padding:0 8px;
    gap:7px;
  }

  .logo-text{
    font-size:17px;
  }

  .logo-img{
    width:35px;
    height:35px;
  }

  .search{
    min-width:60px;
    font-size:12px;
  }

  .admin-btn{
    padding:8px 11px;
    font-size:12px;
  }

  .container{
    padding:12px;
  }

  .hero{
    padding:25px 19px;
  }

  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .thumbnail{
    height:190px;
  }

  .video-player{
    height:55vh;
  }

  .box{
    padding:15px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<div class="logo-area" onclick="openAdminLogin()">

<img
id="logoImage"
class="logo-img"
alt="Logo">

<div
id="siteName"
class="logo-text">
Short Drama
</div>

</div>


<input
id="search"
class="search"
placeholder="Search dramas..."
oninput="renderVideos()">


<button
class="admin-btn"
onclick="openAdminLogin()">

Admin

</button>

</header>


<!-- ================= NAVIGATION ================= -->

<nav>

<button
class="nav-btn"
onclick="changeCategory('All')">
Home
</button>

<button
class="nav-btn"
onclick="changeCategory('Series')">
Series
</button>

<button
class="nav-btn"
onclick="changeCategory('Movies')">
Movies
</button>

<button
class="nav-btn"
onclick="changeCategory('Shorts')">
Shorts
</button>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">

<section class="hero">

<h1 id="heroTitle">
Welcome to Short Drama
</h1>

<p>
Watch public short dramas, series, movies and shorts.
</p>

<p class="muted">
🎬 सभी videos public हैं।
</p>

</section>


<h2 id="sectionTitle">
Latest Videos
</h2>


<div
id="videoGrid"
class="grid">
</div>

</main>


<!-- ================= MODAL ================= -->

<div
id="modal"
class="modal hidden">
</div>


<script>

/* =====================================================
   DATABASE
===================================================== */

const DATABASE_KEY="SHORT_DRAMA_DATABASE";

const SETTINGS_KEY="SHORT_DRAMA_SETTINGS";

const STATS_KEY="SHORT_DRAMA_STATS";


let database=
JSON.parse(
localStorage.getItem(DATABASE_KEY)
)
||
{
  videos:[]
};


let settings=
JSON.parse(
localStorage.getItem(SETTINGS_KEY)
)
||
{
  siteName:"Short Drama",
  logo:""
};


let stats=
JSON.parse(
localStorage.getItem(STATS_KEY)
)
||
{
  visits:0,
  views:0,
  videoViews:{}
};


let currentCategory="All";


/* =====================================================
   SAVE
===================================================== */

function saveDatabase(){

localStorage.setItem(
DATABASE_KEY,
JSON.stringify(database)
);

}


function saveSettings(){

localStorage.setItem(
SETTINGS_KEY,
JSON.stringify(settings)
);

}


function saveStats(){

localStorage.setItem(
STATS_KEY,
JSON.stringify(stats)
);

}


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   WEBSITE SETTINGS
===================================================== */

function applySettings(){

document.title=
settings.siteName || "Short Drama";


document.getElementById(
"siteName"
).innerText=
settings.siteName || "Short Drama";


document.getElementById(
"heroTitle"
).innerText=
"Welcome to "
+
(settings.siteName || "Short Drama");


const logo=
document.getElementById(
"logoImage"
);


if(settings.logo){

logo.src=
settings.logo;

logo.style.display=
"block";

}else{

logo.style.display=
"none";

}

}


/* =====================================================
   WEBSITE VISIT
===================================================== */

function countVisit(){

stats.visits++;

saveStats();

}


/* =====================================================
   CATEGORY
===================================================== */

function changeCategory(category){

currentCategory=
category;

renderVideos();

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(){

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const videos=
database.videos.filter(
video=>{

const categoryMatch=
currentCategory==="All"
||
video.category===
currentCategory;


const searchMatch=
(video.title||"")
.toLowerCase()
.includes(search);


return
categoryMatch &&
searchMatch;

});


document.getElementById(
"sectionTitle"
).innerText=
currentCategory==="All"
?
"Latest Videos"
:
currentCategory;


let html="";


videos.forEach(video=>{

const thumbnail=
video.thumbnail
?
`
<img
class="thumbnail-image"
src="${safe(video.thumbnail)}">
`
:
`
<div
style="font-size:48px">
🎬
</div>
`;


html+=`

<div
class="card"
onclick="watchVideo('${safe(video.id)}')">


<div class="thumbnail">

${thumbnail}

<div class="play">
▶
</div>

</div>


<div class="info">

<h3>
${safe(video.title)}
</h3>

<p class="muted">
${safe(video.category)}
</p>

<p class="muted">
Public • Watch Now
</p>

</div>

</div>

`;

});


if(!html){

html=`

<div class="empty">

<h3>
No dramas found
</h3>

<p>
Admin Panel से नया video add करें।
</p>

</div>

`;

}


document.getElementById(
"videoGrid"
).innerHTML=
html;

}


/* =====================================================
   WATCH VIDEO
===================================================== */

function watchVideo(id){

const video=
database.videos.find(
v=>v.id===id
);


if(!video)return;


/* COUNT VIEW */

stats.views++;


if(!stats.videoViews[id]){

stats.videoViews[id]=0;

}

stats.videoViews[id]++;


saveStats();


const rawUrl=
String(video.url||"").trim();


let player="";


if(rawUrl){

/* YOUTUBE */

const yt=
rawUrl.match(
/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
);


/* GOOGLE DRIVE */

const drive=
rawUrl.match(
/drive\.google\.com\/file\/d\/([^/]+)/
);


/* VIMEO */

const vimeo=
rawUrl.match(
/vimeo\.com\/(\d+)/
);


if(yt){

const embedUrl=
"https://www.youtube.com/embed/"
+
yt[1]
+
"?autoplay=1&rel=0";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

`;

}


else if(drive){

const embedUrl=
"https://drive.google.com/file/d/"
+
drive[1]
+
"/preview";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay"
allowfullscreen>
</iframe>

`;

}


else if(vimeo){

const embedUrl=
"https://player.vimeo.com/video/"
+
vimeo[1]
+
"?autoplay=1";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay;fullscreen;picture-in-picture"
allowfullscreen>
</iframe>

`;

}


else{

/* DIRECT MP4 */

player=`

<video
class="video-player"
controls
playsinline
preload="metadata">

<source
src="${safe(rawUrl)}">

Your browser does not support video.

</video>

`;

}

}


else{

player=`

<div
style="
background:#000;
padding:90px 15px;
text-align:center;
">

<h2>
🎬 Video Ready
</h2>

<p>
इस video का URL अभी नहीं डाला गया है।
</p>

</div>

`;

}


openModal(`

<div class="box">

<h2>
${safe(video.title)}
</h2>

${player}

<p>
${safe(video.description)}
</p>

<p class="muted">
👀 ${stats.videoViews[id] || 0} views
</p>

<button
class="btn gray"
onclick="closeModal()">
Close
</button>

</div>

`);

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function openAdminLogin(){

openModal(`

<div class="box">

<h2>
👑 Admin Login
</h2>

<p class="muted">
केवल website owner के लिए।
</p>

<input
id="adminPassword"
type="password"
placeholder="Admin Password"
onkeydown="
if(event.key==='Enter')
checkAdmin()
">


<div class="row">

<button
class="btn red"
onclick="checkAdmin()">
Login
</button>


<button
class="btn gray"
onclick="closeModal()">
Cancel
</button>

</div>

</div>

`);

setTimeout(
()=>{
document
.getElementById("adminPassword")
?.focus();
},
50
);

}


/* =====================================================
   CHECK ADMIN
===================================================== */

function checkAdmin(){

const password=
document
.getElementById("adminPassword")
.value;


/* ADMIN PASSWORD */

if(
password!=="admin123"
){

alert(
"Wrong Admin Password"
);

return;

}


adminPanel();

}


/* =====================================================
   ADMIN PANEL
===================================================== */

function adminPanel(){

openModal(`

<div class="box">

<h2>
👑 ${safe(settings.siteName)}
- Admin Dashboard
</h2>


<!-- DASHBOARD -->

<div class="dashboard-grid">


<div class="stat-card">

<div class="stat-icon">
👥
</div>

<div class="stat-number">
${stats.visits}
</div>

<div class="stat-title">
Website Visits
</div>

</div>


<div class="stat-card">

<div class="stat-icon">
👀
</div>

<div class="stat-number">
${stats.views}
</div>

<div class="stat-title">
Video Views
</div>

</div>


<div class="stat-card">

<div class="stat-icon">
🎬
</div>

<div class="stat-number">
${database.videos.length}
</div>

<div class="stat-title">
Total Videos
</div>

</div>


</div>


<hr>


<!-- WEBSITE SETTINGS -->

<h3>
⚙️ Website Settings
</h3>


<label class="muted">
Website Name
</label>

<input
id="newSiteName"
value="${safe(settings.siteName)}"
placeholder="Website Name">


<label class="muted">
Logo
</label>

<input
id="logoFile"
type="file"
accept="image/*">


<div id="logoPreview"></div>


<button
class="btn blue"
onclick="saveWebsiteSettings()">

💾 Save Website Settings

</button>


<hr>


<!-- ADD VIDEO -->

<h3>
➕ Add Public Drama
</h3>


<input
id="videoTitle"
placeholder="Drama / Series title">


<select
id="videoCategory">

<option value="Series">
Series
</option>

<option value="Movies">
Movies
</option>

<option value="Shorts">
Shorts
</option>

</select>


<input
id="videoURL"
placeholder="YouTube / MP4 / Google Drive / Vimeo URL">


<input
id="thumbnailURL"
placeholder="Thumbnail Image URL (optional)">


<textarea
id="videoDescription"
placeholder="Video description">
</textarea>


<button
class="btn green"
onclick="addVideo()">

➕ Add Public Video

</button>


<hr>


<!-- VIDEO LIST -->

<h3>
📺 All Videos
</h3>


<div id="adminVideoList">
</div>


<hr>


<button
class="btn danger"
onclick="resetStats()">

♻️ Reset Visits & Views

</button>


<button
class="btn gray"
onclick="closeModal()">

Close Admin

</button>


</div>

`);


renderAdminVideoList();

}


/* =====================================================
   ADMIN VIDEO LIST
===================================================== */

function renderAdminVideoList(){

const box=
document.getElementById(
"adminVideoList"
);


if(!box)return;


if(!database.videos.length){

box.innerHTML=
`
<p class="muted">
अभी कोई video नहीं है।
</p>
`;

return;

}


let html="";


database.videos.forEach(
video=>{

html+=`

<div class="video-stat">

<div class="video-stat-title">

${safe(video.title)}

</div>


<p class="small">

<span class="badge">
${safe(video.category)}
</span>

&nbsp;

👀
${stats.videoViews[video.id] || 0}
Views

</p>


<div class="row">

<button
class="btn red"
onclick="deleteVideo('${safe(video.id)}')">

Delete

</button>

</div>

</div>

`;

});


box.innerHTML=
html;

}


/* =====================================================
   ADD VIDEO
===================================================== */

function addVideo(){

const title=
document
.getElementById("videoTitle")
.value
.trim();


const category=
document
.getElementById("videoCategory")
.value;


const url=
document
.getElementById("videoURL")
.value
.trim();


const thumbnail=
document
.getElementById("thumbnailURL")
.value
.trim();


const description=
document
.getElementById("videoDescription")
.value
.trim();


if(!title){

alert(
"Drama title डालें"
);

return;

}


const newVideo={

id:
"video_"+Date.now(),

title:
title,

category:
category,

url:
url,

thumbnail:
thumbnail,

description:
description

};


database.videos.push(
newVideo
);


saveDatabase();


alert(
"Video successfully added!"
);


adminPanel();

renderVideos();

}


/* =====================================================
   DELETE VIDEO
===================================================== */

function deleteVideo(id){

if(
!confirm(
"क्या आप इस video को delete करना चाहते हैं?"
)
){

return;

}


database.videos=
database.videos.filter(
video=>
video.id!==id
);


delete stats.videoViews[id];


saveDatabase();

saveStats();


adminPanel();

renderVideos();

}


/* =====================================================
   WEBSITE SETTINGS SAVE
===================================================== */

function saveWebsiteSettings(){

const name=
document
.getElementById("newSiteName")
.value
.trim();


if(name){

settings.siteName=
name;

}


/* LOGO */

const file=
document
.getElementById("logoFile")
.files[0];


if(file){

const reader=
new FileReader();


reader.onload=
function(){

settings.logo=
reader.result;

saveSettings();

applySettings();

alert(
"Website Name और Logo Save हो गया!"
);

adminPanel();

};


reader.readAsDataURL(file);

}else{

saveSettings();

applySettings();

alert(
"Website Name Save हो गया!"
);

adminPanel();

}

}


/* =====================================================
   RESET STATS
===================================================== */

function resetStats(){

if(
!confirm(
"क्या आप सभी Visits और Views को 0 करना चाहते हैं?"
)
){

return;

}


stats={
visits:0,
views:0,
videoViews:{}
};


saveStats();


alert(
"Visits और Views reset हो गए!"
);


adminPanel();

}


/* =====================================================
   MODAL
===================================================== */

function openModal(content){

const modal=
document.getElementById(
"modal"
);


modal.innerHTML=
content;


modal.classList.remove(
"hidden"
);

}


function closeModal(){

const modal=
document.getElementById(
"modal"
);


modal.classList.add(
"hidden"
);


modal.innerHTML="";

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeModal();

}

});


/* =====================================================
   START WEBSITE
===================================================== */

applySettings();

countVisit();

renderVideos();

</script>

</body>
</html>
