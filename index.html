<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Short Drama</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */
header{
  height:64px;
  background:#181818;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #292929;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#ff3030;
  cursor:pointer;
  white-space:nowrap;
}

.search{
  flex:1;
  max-width:650px;
  padding:11px 18px;
  border-radius:24px;
  border:1px solid #444;
  background:#242424;
  color:#fff;
  outline:none;
}

.admin-btn{
  border:0;
  border-radius:22px;
  padding:10px 16px;
  background:#292929;
  color:#fff;
  cursor:pointer;
}

/* NAV */
nav{
  display:flex;
  gap:8px;
  padding:11px 16px;
  background:#151515;
  border-bottom:1px solid #292929;
  overflow-x:auto;
}

.nav-btn{
  border:0;
  background:#292929;
  color:#fff;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.nav-btn:hover,
.admin-btn:hover{
  background:#3a3a3a;
}

/* MAIN */
.container{
  max-width:1400px;
  margin:auto;
  padding:18px;
}

.hero{
  padding:32px 24px;
  border-radius:16px;
  background:linear-gradient(135deg,#292929,#151515);
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 8px;
  font-size:34px;
}

.muted{
  color:#999;
  font-size:13px;
}

/* VIDEO GRID */
.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:#181818;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  background:#222;
}

.thumb{
  height:155px;
  background:linear-gradient(135deg,#292929,#171717);
  display:flex;
  align-items:center;
  justify-content:center;
}

.play{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#ff3030;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.info{
  padding:13px;
}

.info h3{
  margin:0 0 7px;
  font-size:16px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:1000;
}

.hidden{
  display:none !important;
}

.box{
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow:auto;
  background:#1b1b1b;
  border:1px solid #444;
  border-radius:15px;
  padding:20px;
}

.box input,
.box select,
.box textarea{
  width:100%;
  padding:12px;
  margin:6px 0;
  background:#101010;
  color:#fff;
  border:1px solid #444;
  border-radius:8px;
  outline:none;
}

.box textarea{
  height:90px;
  resize:vertical;
}

/* BUTTONS */
.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.red{
  background:#ff3030;
  color:#fff;
}

.green{
  background:#16803c;
  color:#fff;
}

.gray{
  background:#444;
  color:#fff;
}

.danger{
  background:#c62828;
  color:#fff;
}

.row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* VIDEO */
.video-player{
  width:100%;
  height:min(70vh,520px);
  background:#000;
  display:block;
  border:0;
}

.empty{
  text-align:center;
  padding:35px;
  color:#999;
}

.admin-card{
  background:#292929;
  padding:13px;
  border-radius:9px;
  margin:9px 0;
}

hr{
  border:0;
  border-top:1px solid #333;
  margin:22px 0;
}

/* MOBILE */
@media(max-width:600px){

  header{
    height:60px;
    padding:0 9px;
    gap:7px;
  }

  .logo{
    font-size:17px;
  }

  .search{
    min-width:70px;
    font-size:13px;
  }

  .admin-btn{
    padding:8px 11px;
  }

  .container{
    padding:12px;
  }

  .hero{
    padding:24px 18px;
  }

  .hero h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .thumb{
    height:190px;
  }

  .video-player{
    height:55vh;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

<div
class="logo"
onclick="openAdminLogin()">
▶ Short Drama
</div>

<input
id="search"
class="search"
placeholder="Search dramas..."
oninput="renderVideos()">

<button
class="admin-btn"
onclick="openAdminLogin()">
Admin
</button>

</header>


<!-- NAVIGATION -->
<nav>

<button
class="nav-btn"
onclick="changeCategory('All')">
Home
</button>

<button
class="nav-btn"
onclick="changeCategory('Series')">
Series
</button>

<button
class="nav-btn"
onclick="changeCategory('Movies')">
Movies
</button>

<button
class="nav-btn"
onclick="changeCategory('Shorts')">
Shorts
</button>

</nav>


<!-- MAIN -->
<main class="container">

<section class="hero">

<h1>
Welcome to Short Drama
</h1>

<p>
Watch public short dramas, series, movies and shorts.
</p>

<p class="muted">
🎬 सभी videos public हैं।
</p>

</section>


<h2 id="sectionTitle">
Latest Videos
</h2>


<div
id="videoGrid"
class="grid">
</div>

</main>


<!-- MODAL -->
<div
id="modal"
class="modal hidden">
</div>


<script>

/* =====================================
   DATABASE
===================================== */

const DATABASE_KEY="SHORT_DRAMA_DATABASE";


let database=
JSON.parse(
localStorage.getItem(DATABASE_KEY)
)||{

videos:[]

};


let currentCategory="All";


/* =====================================
   SAVE
===================================== */

function saveDatabase(){

localStorage.setItem(
DATABASE_KEY,
JSON.stringify(database)
);

}


/* =====================================
   SAFE TEXT
===================================== */

function safe(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================
   CATEGORY
===================================== */

function changeCategory(category){

currentCategory=category;

renderVideos();

}


/* =====================================
   SHOW VIDEOS
===================================== */

function renderVideos(){

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();


const videos=
database.videos.filter(video=>{

const categoryMatch=
currentCategory==="All"
||
video.category===currentCategory;


const searchMatch=
(video.title||"")
.toLowerCase()
.includes(search);


return categoryMatch &&
searchMatch;

});


document.getElementById(
"sectionTitle"
).innerText=
currentCategory==="All"
?"Latest Videos"
:currentCategory;


let html="";


videos.forEach(video=>{

html+=`

<div
class="card"
onclick="watchVideo('${safe(video.id)}')">

<div class="thumb">

<div class="play">
▶
</div>

</div>


<div class="info">

<h3>
${safe(video.title)}
</h3>

<p class="muted">
${safe(video.category)}
</p>

<p class="muted">
Public • Watch Now
</p>

</div>

</div>

`;

});


if(!html){

html=`

<div class="empty">

<h3>
No dramas found
</h3>

<p>
Admin से video add करें या दूसरा search करें।
</p>

</div>

`;

}


document.getElementById(
"videoGrid"
).innerHTML=html;

}


/* =====================================
   WATCH VIDEO
===================================== */

function watchVideo(id){

const video=
database.videos.find(
v=>v.id===id
);


if(!video)return;


const rawUrl=
String(video.url||"").trim();


let player="";


if(rawUrl){

/* YOUTUBE */

const yt=
rawUrl.match(
/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/
);


/* GOOGLE DRIVE */

const drive=
rawUrl.match(
/drive\.google\.com\/file\/d\/([^/]+)/
);


/* VIMEO */

const vimeo=
rawUrl.match(
/vimeo\.com\/(\d+)/
);


if(yt){

const embedUrl=
"https://www.youtube.com/embed/"
+
yt[1]
+
"?autoplay=1&rel=0";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay; encrypted-media; picture-in-picture"
allowfullscreen>
</iframe>

`;

}


else if(drive){

const embedUrl=
"https://drive.google.com/file/d/"
+
drive[1]
+
"/preview";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay"
allowfullscreen>
</iframe>

`;

}


else if(vimeo){

const embedUrl=
"https://player.vimeo.com/video/"
+
vimeo[1]
+
"?autoplay=1";


player=`

<iframe
class="video-player"
src="${safe(embedUrl)}"
title="${safe(video.title)}"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

`;

}


else{

/* DIRECT MP4 */

player=`

<video
class="video-player"
controls
playsinline
preload="metadata">

<source
src="${safe(rawUrl)}">

Your browser does not support video.

</video>

`;

}

}


else{

player=`

<div
style="
background:#000;
padding:80px 15px;
text-align:center;
">

<h2>
🎬 Video Ready
</h2>

<p>
Admin ने अभी video URL नहीं डाला है।
</p>

</div>

`;

}


openModal(`

<div class="box">

<h2>
${safe(video.title)}
</h2>

${player}

<p>
${safe(video.description)}
</p>

<button
class="btn gray"
onclick="closeModal()">
Close
</button>

</div>

`);

}


/* =====================================
   ADMIN LOGIN
===================================== */

function openAdminLogin(){

openModal(`

<div class="box">

<h2>
👑 Admin Login
</h2>

<p class="muted">
केवल website owner के लिए।
</p>

<input
id="adminPassword"
type="password"
placeholder="Admin Password"
onkeydown="
if(event.key==='Enter')
checkAdmin()
">

<div class="row">

<button
class="btn red"
onclick="checkAdmin()">
Login
</button>

<button
class="btn gray"
onclick="closeModal()">
Cancel
</button>

</div>

</div>

`);

}


/* =====================================
   ADMIN PASSWORD
===================================== */

function checkAdmin(){

const password=
document.getElementById(
"adminPassword"
).value;


/* PASSWORD */

if(password!=="admin123"){

alert(
"Wrong Admin Password"
);

return;

}


adminPanel();

}


/* =====================================
   ADMIN PANEL
===================================== */

function adminPanel(){

let videosHTML="";


database.videos.forEach(video=>{

videosHTML+=`

<div class="admin-card">

<h3>
${safe(video.title)}
</h3>

<p class="muted">
Category:
${safe(video.category)}
</p>

<p class="muted">

${
video.url
?
"✅ Video URL Added"
:
"⚠️ Video URL Not Added"
}

</p>


<button
class="btn danger"
onclick="deleteVideo('${safe(video.id)}')">

Delete

</button>

</div>

`;

});


openModal(`

<div class="box">

<h2>
👑 Short Drama - Admin
</h2>

<hr>


<h3>
➕ Add Public Drama
</h3>


<input
id="videoTitle"
placeholder="Drama / Series title">


<select
id="videoCategory">

<option value="Series">
Series
</option>

<option value="Movies">
Movies
</option>

<option value="Shorts">
Shorts
</option>

</select>


<input
id="videoURL"
placeholder="YouTube / MP4 / Google Drive / Vimeo URL">


<textarea
id="videoDescription"
placeholder="Video description">
</textarea>


<button
class="btn green"
onclick="addVideo()">

Add Public Video

</button>


<hr>


<h3>
📺 All Videos
</h3>


${videosHTML || 
'<p class="muted">अभी कोई video नहीं है।</p>'
}


<hr>


<button
class="btn gray"
onclick="closeModal()">

Close Admin

</button>


</div>

`);

}


/* =====================================
   ADD VIDEO
===================================== */

function addVideo(){

const title=
document
.getElementById("videoTitle")
.value
.trim();


const category=
document
.getElementById("videoCategory")
.value;


const url=
document
.getElementById("videoURL")
.value
.trim();


const description=
document
.getElementById("videoDescription")
.value
.trim();


if(!title){

alert(
"Drama title डालें"
);

return;

}


const newVideo={

id:
"video_"+Date.now(),

title:
title,

category:
category,

url:
url,

description:
description

};


database.videos.push(
newVideo
);


saveDatabase();


alert(
"Video successfully added!"
);


adminPanel();

renderVideos();

}


/* =====================================
   DELETE VIDEO
===================================== */

function deleteVideo(id){

if(
!confirm(
"क्या आप इस video को delete करना चाहते हैं?"
)
){

return;

}


database.videos=
database.videos.filter(
video=>video.id!==id
);


saveDatabase();


adminPanel();

renderVideos();

}


/* =====================================
   MODAL
===================================== */

function openModal(content){

const modal=
document.getElementById(
"modal"
);

modal.innerHTML=
content;

modal.classList.remove(
"hidden"
);

}


function closeModal(){

const modal=
document.getElementById(
"modal"
);

modal.classList.add(
"hidden"
);

modal.innerHTML="";

}


/* ESC KEY */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeModal();

}

});


/* START */

renderVideos();

</script>

</body>
</html>
