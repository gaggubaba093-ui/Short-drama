<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Short Drama</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f0f0f;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:65px;
background:#181818;
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #292929;
}

.logoArea{
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
white-space:nowrap;
}

.logoImg{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
display:none;
}

.logoText{
font-size:22px;
font-weight:bold;
color:#ff3030;
}

.search{
flex:1;
max-width:650px;
padding:12px 18px;
border-radius:25px;
border:1px solid #444;
background:#242424;
color:#fff;
outline:none;
}

.adminBtn{
background:#292929;
color:#fff;
border:0;
padding:10px 17px;
border-radius:22px;
cursor:pointer;
}


/* =========================
   SUBSCRIBE BAR
========================= */

.subscribeBar{
margin:15px auto 0;
max-width:1400px;
padding:14px 20px;

background:#181818;
border:1px solid #292929;
border-radius:12px;

display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.subscribeInfo{
display:flex;
align-items:center;
gap:12px;
}

.subscribeIcon{
width:45px;
height:45px;
border-radius:50%;
background:#ff0000;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;
}

.subscribeInfo strong{
font-size:16px;
}

.subscribeInfo p{
margin:4px 0 0;
color:#999;
font-size:13px;
}

.subscribeButton{
background:#ff0000;
color:#fff;
text-decoration:none;

padding:11px 18px;
border-radius:22px;

font-weight:bold;
white-space:nowrap;
}

.subscribeButton:hover{
background:#cc0000;
}


/* =========================
   NAV
========================= */

nav{
display:flex;
gap:8px;
padding:11px 15px;

background:#151515;

border-bottom:1px solid #292929;

overflow-x:auto;
}

.navBtn{
background:#292929;
color:#fff;

border:0;

padding:10px 20px;

border-radius:20px;

cursor:pointer;

white-space:nowrap;
}

.navBtn.active{
background:#ff3030;
}


/* =========================
   MAIN
========================= */

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.hero{
padding:35px 25px;

border-radius:17px;

background:
linear-gradient(
135deg,
#292929,
#151515
);

margin-bottom:25px;
}

.hero h1{
margin:0 0 10px;
font-size:35px;
}

.hero p{
color:#aaa;
}

.titleBoard{
padding:18px 20px;

margin-bottom:25px;

background:#191919;

border-left:5px solid #ff3030;

border-radius:10px;
}

.titleBoard h2{
margin:0;
font-size:25px;
}

.titleBoard p{
margin:7px 0 0;
color:#999;
}


/* =========================
   VIDEO GRID
========================= */

.grid{
display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(250px,1fr)
);

gap:19px;
}

.card{
background:#181818;

border-radius:13px;

overflow:hidden;

cursor:pointer;

transition:.2s;
}

.card:hover{
transform:translateY(-4px);
background:#222;
}

.thumbnail{
height:160px;

background:#252525;

position:relative;

overflow:hidden;
}

.thumbnail img{
width:100%;
height:100%;

object-fit:cover;

display:block;
}

.play{
position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

width:58px;
height:58px;

border-radius:50%;

background:#ff0000;

display:flex;

align-items:center;
justify-content:center;

font-size:23px;

box-shadow:
0 4px 18px #000;
}

.info{
padding:14px;
}

.info h3{
margin:0 0 8px;

font-size:17px;

line-height:1.35;
}

.muted{
color:#999;

font-size:13px;
}

.empty{
padding:50px 20px;

text-align:center;

color:#999;
}


/* =========================
   MODAL
========================= */

.modal{
position:fixed;

inset:0;

background:
rgba(0,0,0,.94);

display:flex;

align-items:center;
justify-content:center;

padding:15px;

z-index:1000;
}

.hidden{
display:none!important;
}

.box{
width:100%;

max-width:900px;

max-height:94vh;

overflow:auto;

background:#1b1b1b;

border:1px solid #444;

border-radius:16px;

padding:20px;
}

.box input,
.box select,
.box textarea{

width:100%;

padding:13px;

margin:7px 0;

background:#101010;

color:#fff;

border:1px solid #444;

border-radius:8px;

outline:none;
}

.box textarea{
height:90px;

resize:vertical;
}

.btn{
border:0;

border-radius:8px;

padding:11px 17px;

cursor:pointer;

font-weight:bold;

margin:4px;
}

.red{
background:#ff3030;
color:#fff;
}

.green{
background:#16803c;
color:#fff;
}

.blue{
background:#1769aa;
color:#fff;
}

.gray{
background:#444;
color:#fff;
}

.danger{
background:#c62828;
color:#fff;
}


/* =========================
   STATS
========================= */

.stats{
display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(150px,1fr)
);

gap:12px;

margin:15px 0;
}

.stat{
background:#292929;

border:1px solid #3a3a3a;

border-radius:12px;

padding:18px;

text-align:center;
}

.statIcon{
font-size:30px;
}

.statNumber{
font-size:28px;

font-weight:bold;

margin:6px;
}

.statTitle{
color:#aaa;

font-size:13px;
}


/* =========================
   ADMIN VIDEOS
========================= */

.videoStat{
background:#242424;

padding:14px;

border-radius:10px;

margin:9px 0;
}

.videoStat img{

width:160px;
height:90px;

object-fit:cover;

border-radius:7px;

display:block;

margin-bottom:9px;
}


/* =========================
   PLAYER
========================= */

.videoPlayer{

width:100%;

height:min(
70vh,
520px
);

background:#000;

border:0;

display:block;
}


/* =========================
   AUTO THUMBNAIL
========================= */

.autoThumb{

width:100%;

max-height:220px;

object-fit:cover;

border-radius:10px;

margin-top:8px;

display:none;
}

.status{

padding:9px;

border-radius:7px;

background:#222;

color:#aaa;

font-size:13px;

margin:5px 0;
}

hr{

border:0;

border-top:
1px solid #333;

margin:23px 0;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

header{

height:60px;

padding:0 8px;

gap:7px;
}

.logoText{
font-size:17px;
}

.logoImg{

width:35px;
height:35px;
}

.search{

min-width:60px;

font-size:12px;
}

.adminBtn{

padding:9px 11px;

font-size:12px;
}

.subscribeBar{

margin:10px 12px 0;

padding:12px;
}

.subscribeInfo strong{

font-size:13px;
}

.subscribeInfo p{

font-size:11px;
}

.subscribeButton{

padding:9px 12px;

font-size:12px;
}

.subscribeIcon{

width:38px;

height:38px;
}

.container{

padding:12px;
}

.hero{

padding:25px 19px;
}

.hero h1{

font-size:28px;
}

.titleBoard h2{

font-size:21px;
}

.grid{

grid-template-columns:1fr;
}

.thumbnail{

height:190px;
}

.videoPlayer{

height:55vh;
}

.box{

padding:15px;
}

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div
class="logoArea"
onclick="openAdminLogin()"
>

<img
id="logoImg"
class="logoImg"
>

<div
id="logoText"
class="logoText"
>
Short Drama
</div>

</div>


<input
id="search"
class="search"
placeholder="Search dramas..."
oninput="renderVideos()"
>


<button
class="adminBtn"
onclick="openAdminLogin()"
>
Admin
</button>

</header>



<!-- =========================
     SUBSCRIBE CHANNEL
========================= -->

<div class="subscribeBar">

<div class="subscribeInfo">

<div class="subscribeIcon">
▶
</div>

<div>

<strong>
Arshlan Short Drama
</strong>

<p>
नए Drama Videos के लिए Subscribe करें
</p>

</div>

</div>


<a
id="subscribeButton"
class="subscribeButton"

href="https://youtube.com/@arshlanshort?sub_confirmation=1"

target="_blank"

rel="noopener"
>

🔴 Subscribe Channel

</a>

</div>



<!-- =========================
     NAVIGATION
========================= -->

<nav>

<button
id="navAll"
class="navBtn active"
onclick="changeCategory('All')"
>
Home
</button>


<button
id="navSeries"
class="navBtn"
onclick="changeCategory('Series')"
>
Series
</button>


<button
id="navMovies"
class="navBtn"
onclick="changeCategory('Movies')"
>
Movies
</button>


<button
id="navShorts"
class="navBtn"
onclick="changeCategory('Shorts')"
>
Shorts
</button>

</nav>



<!-- =========================
     MAIN
========================= -->

<main class="container">


<section class="hero">

<h1 id="heroTitle">
Welcome to Short Drama
</h1>

<p>
Watch your favourite short dramas,
series, movies and shorts.
</p>

<p class="muted">
🎬 सभी videos public हैं।
</p>

</section>



<div class="titleBoard">

<h2 id="titleBoardText">
Latest Short Dramas
</h2>

<p id="titleBoardSub">
New videos and dramas
</p>

</div>



<h2 id="sectionTitle">
Latest Videos
</h2>


<div
id="videoGrid"
class="grid"
>
</div>


</main>



<!-- =========================
     MODAL
========================= -->

<div
id="modal"
class="modal hidden"
>
</div>



<script>


/* =========================================
   YOUR YOUTUBE CHANNEL
========================================= */

const CHANNEL_URL =
"https://youtube.com/@arshlanshort";


/* =========================================
   DATABASE
========================================= */

const DB_KEY =
"SHORT_DRAMA_DATABASE";

const OLD_KEY =
"ARSLAN_YOUTUBE_DATABASE";


let database =
JSON.parse(
localStorage.getItem(DB_KEY)
)
||
{
videos:[]
};


let settings =
JSON.parse(
localStorage.getItem(
"SHORT_DRAMA_SETTINGS"
)
)
||
{
name:"Short Drama",
logo:"",
titleBoard:
"Latest Short Dramas",
titleBoardSub:
"New videos and dramas"
};


let stats =
JSON.parse(
localStorage.getItem(
"SHORT_DRAMA_STATS"
)
)
||
{
visits:0,
views:0,
videoViews:{}
};


let currentCategory =
"All";


/* =========================================
   SAVE DATABASE
========================================= */

function saveAll(){

localStorage.setItem(
DB_KEY,
JSON.stringify(database)
);

localStorage.setItem(
"SHORT_DRAMA_SETTINGS",
JSON.stringify(settings)
);

localStorage.setItem(
"SHORT_DRAMA_STATS",
JSON.stringify(stats)
);

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(text){

return String(text || "")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =========================================
   GET YOUTUBE ID
========================================= */

function getYouTubeId(url){

if(!url)
return "";

url =
String(url).trim();


let patterns = [

/youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})/,

/youtube\.com\/watch\?.*v=([A-Za-z0-9_-]{11})/,

/youtu\.be\/([A-Za-z0-9_-]{11})/,

/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,

/youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,

/youtube\.com\/live\/([A-Za-z0-9_-]{11})/

];


for(
let pattern of patterns
){

let match =
url.match(pattern);


if(match){

return match[1];

}

}


return "";

}


/* =========================================
   AUTOMATIC THUMBNAIL
========================================= */

function getYouTubeThumbnail(id){

if(!id)
return "";

return
"https://i.ytimg.com/vi/"
+
id
+
"/hqdefault.jpg";

}


/* =========================================
   AUTOMATIC TITLE
========================================= */

async function getYouTubeTitle(url){

try{

let response =
await fetch(

"https://www.youtube.com/oembed?url="
+
encodeURIComponent(url)
+
"&format=json"

);


if(!response.ok)
return "";


let data =
await response.json();


return data.title || "";

}

catch(error){

return "";

}

}


/* =========================================
   OLD DATABASE MIGRATION
========================================= */

function migrateOldVideos(){

try{

let old =
JSON.parse(
localStorage.getItem(
OLD_KEY
)
);


if(
!old ||
!Array.isArray(old.videos)
)
return;


old.videos.forEach(
oldVideo => {


let oldId =
oldVideo.id ||
"";


let exists =
database.videos.some(
v =>
v.id === oldId
);


if(exists)
return;


let url =
oldVideo.url ||
"";


let youtubeId =
oldVideo.youtubeId ||
getYouTubeId(url);


database.videos.push({

id:
oldId ||
"video_" +
Date.now() +
Math.random(),

title:
oldVideo.title ||
"YouTube Video",

category:
oldVideo.category ||
"Shorts",

url:
url,

youtubeId:
youtubeId,

thumbnail:
oldVideo.thumbnail ||
getYouTubeThumbnail(
youtubeId
),

description:
oldVideo.description ||
""

});


});


saveAll();

}

catch(error){

console.log(
"Migration Error:",
error
);

}

}


/* =========================================
   APPLY SETTINGS
========================================= */

function applySettings(){

let name =
settings.name ||
"Short Drama";


document.title =
name;


let logoText =
document.getElementById(
"logoText"
);


if(logoText){

logoText.innerText =
name;

}


let hero =
document.getElementById(
"heroTitle"
);


if(hero){

hero.innerText =
"Welcome to " +
name;

}


let board =
document.getElementById(
"titleBoardText"
);


if(board){

board.innerText =
settings.titleBoard ||
"Latest Short Dramas";

}


let sub =
document.getElementById(
"titleBoardSub"
);


if(sub){

sub.innerText =
settings.titleBoardSub ||
"New videos and dramas";

}


let logo =
document.getElementById(
"logoImg"
);


if(logo){

if(settings.logo){

logo.src =
settings.logo;

logo.style.display =
"block";

}

else{

logo.style.display =
"none";

}

}

}


/* =========================================
   SUBSCRIBE BUTTON
========================================= */

function setupSubscribeButton(){

let button =
document.getElementById(
"subscribeButton"
);


if(!button)
return;


button.href =
CHANNEL_URL +
"?sub_confirmation=1";

}


/* =========================================
   CATEGORY
========================================= */

function changeCategory(
category
){

currentCategory =
category;


document
.querySelectorAll(
".navBtn"
)
.forEach(
btn =>
btn.classList.remove(
"active"
)
);


if(
category === "All"
){

document
.getElementById(
"navAll"
)
.classList.add(
"active"
);

}


if(
category === "Series"
){

document
.getElementById(
"navSeries"
)
.classList.add(
"active"
);

}


if(
category === "Movies"
){

document
.getElementById(
"navMovies"
)
.classList.add(
"active"
);

}


if(
category === "Shorts"
){

document
.getElementById(
"navShorts"
)
.classList.add(
"active"
);

}


renderVideos();

}


/* =========================================
   RENDER VIDEOS
========================================= */

function renderVideos(){

let grid =
document.getElementById(
"videoGrid"
);


if(!grid)
return;


let search =
document
.getElementById(
"search"
)
.value
.toLowerCase()
.trim();


let videos =
database.videos.filter(
video => {

let categoryOK =
currentCategory === "All"
||
video.category ===
currentCategory;


let title =
String(
video.title || ""
)
.toLowerCase();


let searchOK =
title.includes(
search
);


return (
categoryOK &&
searchOK
);

});


let html = "";


videos.forEach(
video => {


let youtubeId =
video.youtubeId ||
getYouTubeId(
video.url
);


let thumbnail =
video.thumbnail ||
getYouTubeThumbnail(
youtubeId
);


html += `

<div
class="card"
onclick="
watchVideo('${safe(video.id)}')
"
>

<div
class="thumbnail"
>

${
thumbnail

?

`
<img
src="${safe(thumbnail)}"
alt="${safe(video.title)}"
onerror="
this.src='https://i.ytimg.com/vi/${safe(youtubeId)}/hqdefault.jpg';
"
>
`

:

`

<div style="
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
">

🎬

</div>

`
}


<div class="play">
▶
</div>

</div>


<div class="info">

<h3>
${safe(video.title)}
</h3>


<p class="muted">
📂 ${safe(video.category)}
</p>


<p class="muted">

👀
${stats.videoViews[video.id] || 0}
Views

</p>

</div>

</div>

`;

});


if(!html){

html = `

<div class="empty">

<h2>
अभी कोई Video नहीं है
</h2>

<p>
Admin Dashboard से YouTube Video Add करें।
</p>

</div>

`;

}


grid.innerHTML =
html;


let section =
document.getElementById(
"sectionTitle"
);


if(section){

section.innerText =
currentCategory === "All"
?
"Latest Videos"
:
currentCategory;

}

}


/* =========================================
   WATCH VIDEO
========================================= */

function watchVideo(id){

let video =
database.videos.find(
v =>
v.id === id
);


if(!video)
return;


stats.views++;


if(
!stats.videoViews[id]
){

stats.videoViews[id] =
0;

}


stats.videoViews[id]++;


saveAll();


let youtubeId =
video.youtubeId ||
getYouTubeId(
video.url
);


let player = "";


if(youtubeId){

player = `

<iframe

class="videoPlayer"

src="
https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0
"

title="${safe(video.title)}"

allow="
autoplay;
encrypted-media;
picture-in-picture;
web-share
"

allowfullscreen>

</iframe>

`;

}

else{

player = `

<div style="
height:350px;
background:#000;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
">

<h2>
❌ YouTube Link नहीं मिला
</h2>

</div>

`;

}


openModal(`

<div class="box">

<h2>
${safe(video.title)}
</h2>

${player}

<p>
${safe(video.description)}
</p>

<p class="muted">

👀 Views:
${stats.videoViews[id] || 0}

</p>


<button
class="btn gray"
onclick="closeModal()"
>

Close

</button>

</div>

`);


renderVideos();

}


/* =========================================
   MODAL
========================================= */

function openModal(
content
){

let modal =
document.getElementById(
"modal"
);


modal.innerHTML =
content;


modal.classList.remove(
"hidden"
);

}


function closeModal(){

let modal =
document.getElementById(
"modal"
);


modal.classList.add(
"hidden"
);


modal.innerHTML =
"";

}


/* =========================================
   ADMIN LOGIN
========================================= */

function openAdminLogin(){

openModal(`

<div class="box">

<h2>
👑 Admin Login
</h2>

<p class="muted">
Website Owner
</p>


<input
id="adminPassword"
type="password"
placeholder="Admin Password"

onkeydown="
if(event.key==='Enter')
checkAdmin()
"
>


<button
class="btn red"
onclick="
checkAdmin()
"
>

Login

</button>


<button
class="btn gray"
onclick="
closeModal()
"
>

Cancel

</button>

</div>

`);

}


function checkAdmin(){

let password =
document
.getElementById(
"adminPassword"
)
.value;


if(
password !==
"admin123"
){

alert(
"❌ Wrong Admin Password"
);

return;

}


adminPanel();

}


/* =========================================
   ADMIN PANEL
========================================= */

function adminPanel(){

openModal(`

<div class="box">

<h2>

👑
${safe(settings.name)}
Dashboard

</h2>


<div class="stats">


<div class="stat">

<div class="statIcon">
👥
</div>

<div class="statNumber">
${stats.visits}
</div>

<div class="statTitle">
Website Visits
</div>

</div>


<div class="stat">

<div class="statIcon">
👀
</div>

<div class="statNumber">
${stats.views}
</div>

<div class="statTitle">
Total Video Views
</div>

</div>


<div class="stat">

<div class="statIcon">
🎬
</div>

<div class="statNumber">
${database.videos.length}
</div>

<div class="statTitle">
Total Videos
</div>

</div>


</div>


<hr>


<h3>
⚙️ Website Settings
</h3>


<input
id="websiteName"
value="${safe(settings.name)}"
placeholder="Website Name"
>


<input
id="titleBoard"
value="${safe(settings.titleBoard)}"
placeholder="Title Board"
>


<input
id="titleBoardSub"
value="${safe(settings.titleBoardSub)}"
placeholder="Title Board Subtitle"
>


<label class="muted">
Logo Upload

<input
id="logoFile"
type="file"
accept="image/*"
>


<button
class="btn blue"
onclick="
saveWebsiteSettings()
"
>

💾 Save Settings

</button>


<hr>


<h3>
➕ Add YouTube Video
</h3>


<input
id="videoURL"
placeholder="YouTube Video Link यहाँ डालें"

oninput="
youtubeLinkChanged()
"

onblur="
autoGetYouTubeData()
"
>


<div
id="youtubeStatus"
class="status"
>

YouTube Link डालें

</div>


<input
id="videoTitle"
readonly
placeholder="Title Automatic आएगा"
>


<img
id="autoThumbnail"
class="autoThumb"
src=""
>


<select
id="videoCategory"
>

<option value="Shorts">
Shorts
</option>

<option value="Series">
Series
</option>

<option value="Movies">
Movies
</option>

</select>


<textarea
id="videoDescription"
placeholder="Description optional"
></textarea>

id="addVideoBtn"
class="btn green"
onclick="

"
>

➕ Add Video

📺 All Added Videos
</h3>

id="adminVideos"
>
</div>

"
>

♻️ Reset Views

<button

>

Close Dashboard

</button>

`);


renderAdminVideos();

}


/* =========================================
   YOUTUBE LINK CHANGED
========================================= */

function youtubeLinkChanged(){

let url =
document
.getElementById(
"videoURL"
)
.value
.trim();


let id =
getYouTubeId(url);


let status =
document.getElementById(
"youtubeStatus"
);


if(!url){

status.innerText =
"YouTube Link डालें";

return;

}


if(!id){

status.innerText =
"❌ सही YouTube Link डालें";

return;

}


status.innerText =
"⏳ Title और Thumbnail Loading...";


autoGetYouTubeData();

}


/* =========================================
   AUTO YOUTUBE DATA
========================================= */

async function autoGetYouTubeData(){

let url =
document
.getElementById(
"videoURL"
)
.value
.trim();


let id =
getYouTubeId(url);


if(!id)
return;


let titleInput =
document
.getElementById(
"videoTitle"
);


let thumbnail =
document
.getElementById(
"autoThumbnail"
);


let status =
document
.getElementById(
"youtubeStatus"
);


/* THUMBNAIL */

let thumbURL =
getYouTubeThumbnail(
id
);


thumbnail.src =
thumbURL;


thumbnail.style.display =
"block";


/* TITLE */

titleInput.value =
"⏳ Title Loading...";


status.innerText =
"⏳ Title Loading...";


try{

let title =
await getYouTubeTitle(
url
);


titleInput.value =
title ||
"YouTube Video";


status.innerText =
"✅ Title और Thumbnail Ready";

}

catch(error){

titleInput.value =
"YouTube Video";

status.innerText =
"✅ Thumbnail Ready";

}

}


/* =========================================
   ADD YOUTUBE VIDEO
========================================= */

async function addYouTubeVideo(){

let url =
document
.getElementById(
"videoURL"
)
.value
.trim();


let youtubeId =
getYouTubeId(url);


if(!youtubeId){

alert(
"❌ सही YouTube Link डालें।"
);

return;

}


let button =
document
.getElementById(
"addVideoBtn"
);


button.disabled =
true;


button.innerText =
"⏳ Adding Video...";


try{


let title =
document
.getElementById(
"videoTitle"
)
.value
.trim();


if(
!title ||
title ===
"⏳ Title Loading..."
){

title =
await getYouTubeTitle(
url
);

}


if(!title){

title =
"YouTube Video";

}


let category =
document
.getElementById(
"videoCategory"
)
.value;


let description =
document
.getElementById(
"videoDescription"
)
.value
.trim();


let thumbnail =
getYouTubeThumbnail(
youtubeId
);


let newVideo = {

id:
"video_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,7),

title:
title,

category:
category,

url:
url,

youtubeId:
youtubeId,

thumbnail:
thumbnail,

description:
description

};


database.videos.push(
newVideo
);


saveAll();


renderVideos();


alert(
"✅ Video Successfully Add हो गया!"
);


document
.getElementById(
"videoURL"
)
.value =
"";


document
.getElementById(
"videoTitle"
)
.value =
"";


document
.getElementById(
"videoDescription"
)
.value =
"";


let preview =
document.getElementById(
"autoThumbnail"
);


preview.src =
"";


preview.style.display =
"none";


adminPanel();


}

catch(error){

console.error(error);

alert(
"❌ Video Add नहीं हो पाया।"
);

}

finally{

button.disabled =
false;

button.innerText =
"➕ Add Video";

}

}


/* =========================================
   ADMIN VIDEOS
========================================= */

function renderAdminVideos(){

let box =
document
.getElementById(
"adminVideos"
);


if(!box)
return;


if(
!database.videos.length
){

box.innerHTML = `

<p class="muted">
अभी कोई Video नहीं है।
</p>

`;

return;

}


let html = "";


database.videos
.slice()
.reverse()
.forEach(
video => {


let id =
video.youtubeId ||
getYouTubeId(
video.url
);


let thumbnail =
video.thumbnail ||
getYouTubeThumbnail(
id
);


html += `

<div class="videoStat">


${
thumbnail

?

`
<img
src="${safe(thumbnail)}"
alt="${safe(video.title)}"
>
`

:

""

}


<strong>
${safe(video.title)}
</strong>


<p class="muted">

📂 Category:
${safe(video.category)}

<br>

👀 Views:
${stats.videoViews[video.id] || 0}

</p>


<button
class="btn red"
onclick="
watchVideo('${safe(video.id)}')
"
>

▶ Watch

</button>


<button
class="btn danger"
onclick="
deleteVideo('${safe(video.id)}')
"
>

🗑 Delete

</button>


</div>

`;

});


box.innerHTML =
html;

}


/* =========================================
   DELETE VIDEO
========================================= */

function deleteVideo(id){

if(
!confirm(
"क्या इस Video को Delete करना है?"
)
){

return;

}


database.videos =
database.videos.filter(
video =>
video.id !== id
);


delete stats.videoViews[id];


saveAll();


renderVideos();


adminPanel();

}


/* =========================================
   WEBSITE SETTINGS
========================================= */

function saveWebsiteSettings(){

let name =
document
.getElementById(
"websiteName"
)
.value
.trim();


let board =
document
.getElementById(
"titleBoard"
)
.value
.trim();


let boardSub =
document
.getElementById(
"titleBoardSub"
)
.value
.trim();


if(name)
settings.name =
name;


if(board)
settings.titleBoard =
board;


if(boardSub)
settings.titleBoardSub =
boardSub;


let file =
document
.getElementById(
"logoFile"
)
.files[0];


if(file){

let reader =
new FileReader();


reader.onload =
function(e){

settings.logo =
e.target.result;


saveAll();

applySettings();

renderVideos();


alert(
"✅ Website Settings Saved!"
);


adminPanel();

};


reader.readAsDataURL(
file
);

}

else{

saveAll();

applySettings();

renderVideos();


alert(
"✅ Website Settings Saved!"
);


adminPanel();

}

}


/* =========================================
   RESET STATS
========================================= */

function resetStats(){

if(
!confirm(
"क्या सभी Views को 0 करना है?"
)
){

return;

}


stats = {

visits:0,

views:0,

videoViews:{}

};


saveAll();


renderVideos();


adminPanel();

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
"keydown",
function(e){

if(
e.key === "Escape"
){

closeModal();

}

});


/* =========================================
   START WEBSITE
========================================= */

migrateOldVideos();

applySettings();

setupSubscribeButton();


stats.visits++;


saveAll();


renderVideos();

</script>

</body>
</html>
